name: Build and release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check && npm test
      - name: Desktop integration tests
        run: xvfb-run -a npm run test:ui
      - name: Build Linux app
        run: npm run package -- --publish never
      - name: Portable archive and checksums
        run: |
          tar -czf dist/Paper-Workbench-linux-x86_64.tar.gz -C dist/linux-unpacked .
          test -f dist/latest-linux.yml
          cd dist && sha256sum *.AppImage *.tar.gz > SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: paper-workbench-linux
          path: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/SHA256SUMS-linux.txt
            dist/latest-linux.yml
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check && npm test
      - name: Build unsigned macOS apps
        run: npm run package:mac -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Checksums
        run: cd dist && shasum -a 256 *.dmg *.zip > SHA256SUMS-macos.txt
      - uses: actions/upload-artifact@v4
        with:
          name: paper-workbench-macos
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS-macos.txt
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check && npm test
      - name: Desktop integration tests
        run: npm run test:ui
      - name: Build unsigned Windows app
        run: npm run package:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Checksums
        shell: pwsh
        run: |
          if (!(Test-Path dist/latest.yml)) { throw "Missing Windows update metadata" }
          Get-ChildItem dist/*.exe, dist/*.zip | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content dist/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: paper-workbench-windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS-windows.txt
            dist/latest.yml
            dist/*.blockmap
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
